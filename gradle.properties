# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# RecyclerView is the single AndroidX artifact in this project; everything
# else is platform widgets (plain android.app.Activity + XML layouts).
android.useAndroidX=true

# Per-module R classes to keep builds hermetic.
android.nonTransitiveRClass=true

kotlin.code.style=official
