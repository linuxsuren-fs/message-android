name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle (validates the wrapper jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # See ci.yml: safety net for the exec bit of gradlew.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release-unsigned.apk "message-android-${GITHUB_REF_NAME#v}-release-unsigned.apk"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: message-android-*-release-unsigned.apk
